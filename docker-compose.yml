services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qco
      POSTGRES_PASSWORD: qco
      POSTGRES_DB: qco
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qco"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://qco:qco@db:5432/qco
      DATA_DIR: /data
    depends_on: {db: {condition: service_healthy}}
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://qco:qco@db:5432/qco
      DATA_DIR: /data
    ports: ["8000:8000"]
    volumes: ["./data:/data"]
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes:
  pgdata:
